# Builds the Android app (a thin WebView shell around the website) and publishes it as a GitHub release.
# Run it from the Actions tab ("Run workflow"); the APK is then at
# https://alirezaworktime-art.github.io/implant-plan/implant-plan.apk (served by GitHub Pages, reachable from Iran)
name: Android app
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (e.g. 1.0)"
        required: true
        default: "1.0"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Write Android project
        run: |
          set -e
          P=android
          mkdir -p $P/app/src/main/java/ir/yazd/implantplan $P/app/src/main/res/values
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do mkdir -p $P/app/src/main/res/mipmap-${d%%:*}; done
          # launcher icons from the site's icon (resized)
          sudo apt-get -qq install -y imagemagick >/dev/null
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do convert icon-512.png -resize ${d##*:}x${d##*:} $P/app/src/main/res/mipmap-${d%%:*}/ic_launcher.png; done
          cat > $P/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "ImplantPlan"
          include ':app'
          EOF
          cat > $P/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF
          cat > $P/app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
            namespace 'ir.yazd.implantplan'
            compileSdk 34
            defaultConfig {
              applicationId 'ir.yazd.implantplan'
              minSdk 21
              targetSdk 34
              versionCode ${{ github.run_number }}
              versionName '${{ inputs.version }}'
            }
            signingConfigs { debug { enableV1Signing true; enableV2Signing true; enableV3Signing true } }
            buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > $P/app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">طرح درمان ایمپلنت</string></resources>
          EOF
          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:supportsRtl="true"
                android:usesCleartextTraffic="false" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask"
                  android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|uiMode"
                  android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > $P/app/src/main/java/ir/yazd/implantplan/MainActivity.java <<'EOF'
          package ir.yazd.implantplan;

          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.Window;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends Activity {
            static final String HOME = "https://alirezaworktime-art.github.io/implant-plan/";
            static final String HOST = "alirezaworktime-art.github.io";
            WebView web;

            @Override protected void onCreate(Bundle state) {
              super.onCreate(state);
              Window w = getWindow();
              w.setStatusBarColor(Color.parseColor("#17624f"));
              web = new WebView(this);
              setContentView(web);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setLoadWithOverviewMode(true);
              s.setUseWideViewPort(true);
              s.setSupportZoom(false);
              s.setUserAgentString(s.getUserAgentString() + " ImplantPlanApp/1");
              web.addJavascriptInterface(new Bridge(), "ImplantApp");
              web.setWebChromeClient(new WebChromeClient());
              web.setWebViewClient(new WebViewClient() {
                @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  Uri u = r.getUrl();
                  if (HOST.equals(u.getHost()) && u.getPath() != null && u.getPath().startsWith("/implant-plan")) return false;
                  try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) { }
                  return true;
                }
                @Override public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                  if (!r.isForMainFrame()) return;
                  String html = "<html dir='rtl'><body style='font-family:sans-serif;text-align:center;padding:40px 20px;color:#222'>"
                      + "<h3>اتصال به اینترنت برقرار نشد</h3><p>اینترنت گوشی را چک کنید.</p>"
                      + "<button style='font-size:18px;padding:10px 28px;border:0;border-radius:10px;background:#17624f;color:#fff' "
                      + "onclick=\"location.href='" + HOME + "'\">تلاش دوباره</button></body></html>";
                  v.loadDataWithBaseURL(HOME, html, "text/html", "utf-8", HOME);
                }
              });
              if (state != null) web.restoreState(state); else web.loadUrl(HOME);
            }

            @Override protected void onSaveInstanceState(Bundle out) { super.onSaveInstanceState(out); web.saveState(out); }
            @Override public void onBackPressed() { if (web.canGoBack()) web.goBack(); else super.onBackPressed(); }

            void toast(final String t) { runOnUiThread(() -> Toast.makeText(MainActivity.this, t, Toast.LENGTH_LONG).show()); }

            /** called from the page: window.ImplantApp.saveFile(base64, fileName, mime) */
            class Bridge {
              @JavascriptInterface public void saveFile(String b64, String name, String mime) {
                try {
                  byte[] data = Base64.decode(b64, Base64.DEFAULT);
                  if (name == null || name.trim().isEmpty()) name = "plan.pdf";
                  name = name.replaceAll("[\\\\/:*?\"<>|]+", " ");
                  if (mime == null || mime.isEmpty()) mime = "application/pdf";
                  if (Build.VERSION.SDK_INT >= 29) {
                    ContentResolver cr = getContentResolver();
                    ContentValues cv = new ContentValues();
                    cv.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                    cv.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                    cv.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                    Uri uri = cr.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                    if (uri == null) throw new Exception("no uri");
                    try (OutputStream os = cr.openOutputStream(uri)) { os.write(data); }
                    toast("در پوشه‌ی Download ذخیره شد: " + name);
                    final Uri open = uri; final String m = mime;
                    runOnUiThread(() -> {
                      try {
                        Intent i = new Intent(Intent.ACTION_VIEW);
                        i.setDataAndType(open, m);
                        i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                        startActivity(i);
                      } catch (Exception e) { }
                    });
                  } else {
                    File dir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                    if (dir == null) dir = getFilesDir();
                    File f = new File(dir, name);
                    try (FileOutputStream fo = new FileOutputStream(f)) { fo.write(data); }
                    DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                    if (dm != null) dm.addCompletedDownload(name, name, true, mime, f.getAbsolutePath(), data.length, true);
                    toast("ذخیره شد: " + name);
                  }
                } catch (Exception e) {
                  toast("ذخیره‌ی فایل ممکن نشد: " + e.getMessage());
                }
              }
            }
          }
          EOF
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk implant-plan.apk
          TAG="app-v${{ inputs.version }}-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add implant-plan.apk
          git commit -m "Android app ${{ inputs.version }} (build ${{ github.run_number }})" || true
          git push
          gh release create "$TAG" implant-plan.apk --title "اپلیکیشن اندروید ${{ inputs.version }}" --notes "نسخه‌ی اندروید سایت طرح درمان ایمپلنت. فایل implant-plan.apk را دانلود و نصب کنید." --latest
